general {
    lock_cmd = [ -x ~/.local/bin/isla-lock ] && exec ~/.local/bin/isla-lock || exec hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

listener {
    timeout = 600
    on-timeout = [ -x ~/.local/bin/isla-lock ] && exec ~/.local/bin/isla-lock || exec hyprlock
}

listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
