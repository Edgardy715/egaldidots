[package]
name = "isla-cava-stream"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde_json = "1"
nix = { version = "0.30", features = ["fs", "poll", "process", "signal"] }
signal-hook = "0.3"
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
