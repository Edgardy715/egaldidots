"$schema" = 'https://starship.rs/config-schema.json'

# Isla · paleta pywal generada con contraste para el wallpaper actual.
palette = 'pywal'
add_newline = true
scan_timeout = 30
command_timeout = 500
format = '🎩 $username$hostname$directory$git_branch$git_status$git_state$python$nodejs$bun$rust$golang$nix_shell$docker_context$line_break$character'
right_format = '$status$jobs$cmd_duration$time'

[directory]
style = 'bold wal_fg'
format = '[$path]($style)[$read_only]($read_only_style) '
truncation_length = 3
truncate_to_repo = true
truncation_symbol = '…/'
read_only = ' '
read_only_style = 'bold wal9'

[username]
show_always = false
style_user = 'bold wal13'
style_root = 'bold wal9'
format = '[$user]($style) '

[hostname]
ssh_only = true
ssh_symbol = '↗ '
style = 'wal13'
format = '[$ssh_symbol$hostname]($style) '

[git_branch]
symbol = ' '
style = 'wal13'
format = '[$symbol$branch]($style) '
truncation_length = 28

[git_status]
style = 'wal11'
format = '([$all_status$ahead_behind]($style) )'
conflicted = '≠${count} '
ahead = '↑${count} '
behind = '↓${count} '
diverged = '↑${ahead_count} ↓${behind_count} '
untracked = '?${count} '
stashed = '◌${count} '
modified = '!${count} '
staged = '+${count} '
renamed = '»${count} '
deleted = '×${count} '

[git_state]
style = 'bold wal9'
format = '[($state( $progress_current/$progress_total))]($style) '

[character]
success_symbol = '[❯](bold wal12)'
error_symbol = '[❯](bold wal9)'
vimcmd_symbol = '[❮](bold wal10)'
vimcmd_replace_one_symbol = '[❮](bold wal11)'
vimcmd_replace_symbol = '[❮](bold wal11)'
vimcmd_visual_symbol = '[❮](bold wal13)'

[status]
disabled = false
symbol = '✗ '
style = 'wal9'
format = '[$symbol$status]($style) '

[jobs]
symbol = '↻ '
style = 'wal14'
format = '[$symbol$number]($style) '
number_threshold = 1
symbol_threshold = 1

[cmd_duration]
min_time = 2000
style = 'wal11'
format = '[󱎫 $duration]($style) '

[time]
disabled = false
time_format = '%H:%M'
style = 'wal8'
format = '[$time]($style)'

[python]
symbol = ' '
style = 'wal11'
format = '[${symbol}${version}( \($virtualenv\))]($style) '

[nodejs]
symbol = ' '
style = 'wal10'
format = '[$symbol$version]($style) '

[bun]
symbol = 'bun '
style = 'wal7'
format = '[$symbol$version]($style) '

[rust]
symbol = ' '
style = 'wal9'
format = '[$symbol$version]($style) '

[golang]
symbol = ' '
style = 'wal14'
format = '[$symbol$version]($style) '

[nix_shell]
symbol = ' '
style = 'wal14'
format = '[$symbol$state( \($name\))]($style) '

[docker_context]
symbol = ' '
style = 'wal14'
only_with_files = true
format = '[$symbol$context]($style) '

# Respaldo si pywal todavía no ha generado una paleta.
[palettes.pywal]
wal_fg = '#C8D6E5'
wal7 = '#C8D6E5'
wal8 = '#9AA4B5'
wal9 = '#F08A8A'
wal10 = '#7FD68B'
wal11 = '#E0B860'
wal12 = '#8AB4F8'
wal13 = '#A9B6E5'
wal14 = '#7FD6E5'
